name: atlasiq
x-environment: &environment
  ATLAS_DATABASE_URL: postgresql://atlasiq:atlasiq_local@postgres:5432/atlasiq
  ATLAS_DATA_DIR: /data
  DBT_SEND_ANONYMOUS_USAGE_STATS: 'false'
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atlasiq
      POSTGRES_PASSWORD: atlasiq_local
      POSTGRES_DB: atlasiq
    ports: ['127.0.0.1:5544:5432']
    volumes: [warehouse:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U atlasiq -d atlasiq]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: .
    environment: *environment
    ports: ['127.0.0.1:8020:8020']
    volumes: [landing:/data]
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8020/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  airflow:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    profiles: [orchestration]
    environment:
      <<: *environment
      ATLAS_DATA_DIR: /opt/airflow/atlas-data
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    ports: ['127.0.0.1:8082:8080']
    command: standalone
    volumes: [airflow-state:/opt/airflow]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  warehouse:
    name: atlasiq-postgres
  landing:
  airflow-state:
