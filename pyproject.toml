[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "atlasiq"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "psycopg[binary]>=3.2,<4", "duckdb>=1.3,<2", "dbt-core>=1.10,<2", "dbt-postgres>=1.9,<2", "holidays>=0.70,<1"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.15,<2"]
[project.scripts]
atlasiq = "atlasiq.cli:main"
[tool.ruff]
respect-gitignore = false
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
[tool.hatch.build.targets.wheel]
packages = ["src/atlasiq"]
